[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "477-role1"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "jsonschema==4.26.0", "referencing>=0.36,<1"]
local-cv = ["opencv-python-headless==4.13.0.92", "numpy>=2,<3"]
benchmark = ["ultralytics==8.4.174", "torch==2.9.1", "torchvision==0.24.1", "numpy==2.4.6", "opencv-python==4.13.0.92", "jsonschema==4.26.0", "referencing>=0.36,<1", "python-dotenv>=1,<2", "lap>=0.5.12,<1", "scipy>=1.14,<2"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
